# The engine library is built for thumbv7em-none-eabihf, which passes float
# arguments in FPU registers. The image must use the same calling convention,
# or the link fails ("uses VFP register arguments").
CONFIG_FPU=y
CONFIG_FP_HARDABI=y

# printk to the UART console is all the output there is.
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# The engine works on the caller's stack. Give main room and report how much
# of it the run used.
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y

# main ends the run with a semihosting SYS_EXIT, so `west build -t run`
# returns: QEMU exit status 0 on PASS, 1 on FAIL.
CONFIG_SEMIHOST=y
