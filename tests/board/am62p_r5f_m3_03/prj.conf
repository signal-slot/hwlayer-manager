# SPDX-License-Identifier: Apache-2.0
#
# M3-03 board scenes 9 to 12 on the Verdin AM62P's MCU R5F, started from the
# board's Linux through remoteproc while Linux keeps running, like
# tests/board/am62p_r5f (docs/board-test-am62p-r5f.md). The same settings
# as that app's prj.conf plus a larger console buffer; nothing here has been
# built yet.

# The console is a RAM buffer that the SoC's resource table offers to Linux
# as the remote processor's trace buffer; Linux keeps the UART.
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_RAM_CONSOLE=y
CONFIG_PRINTK=y
# The buffer is a ring (default 1024 bytes) and these scenes print about
# 80 lines, some 7 KB on the host run (more with M3_SWEEP_* raised): too
# small a ring loses the start.
# The size is to be chosen on the board (what the R5F's memory holds).
CONFIG_RAM_CONSOLE_BUFFER_SIZE=16384

CONFIG_WATCHDOG=n
CONFIG_I2C=y
CONFIG_GPIO=y

# The engine is built for armv7r-none-eabihf: the image uses the hard-float
# ABI too.
CONFIG_FPU=y
CONFIG_FP_HARDABI=y

# ce_present and ce_poll_event run on the main thread; scene 10 busy-waits
# on it (k_busy_wait) between two presents.
CONFIG_MAIN_STACK_SIZE=16384
