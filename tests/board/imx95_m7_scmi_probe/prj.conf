#
# Read-only SCMI ownership probe for the i.MX95 M7. See README.md.

CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_MAIN_STACK_SIZE=4096

# Base protocol helpers (vendor, implementation version, agent discovery).
# Off by default in upstream Zephyr.
CONFIG_ARM_SCMI_BASE_HELPERS=y

# Do not let Zephyr drive any power domain. This program only reads states.
CONFIG_POWER_DOMAIN=n
CONFIG_PM=n
CONFIG_PM_DEVICE=n

# Upstream soc_init() sends a CPU sleep-mode request over the NXP CPU
# protocol (0x82) when these helpers are built. Leave them out so that the
# SoC init issues no SCMI request of its own for this program.
CONFIG_NXP_SCMI_CPU_DOMAIN_HELPERS=n

# Give the System Manager more time than the 500 us default to answer.
# A timeout is reported as err=<code>; it never turns into a retry.
CONFIG_ARM_SCMI_CHAN_SEM_TIMEOUT_USEC=10000
