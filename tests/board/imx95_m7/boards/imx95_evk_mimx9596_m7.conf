# SPDX-License-Identifier: Apache-2.0
#
# rpmsg over the Linux remoteproc resource table on the i.MX95 M7.
# Values follow upstream Zephyr's samples/subsys/ipc/openamp_rsc_table
# (prj.conf and boards/imx95_evk_mimx9596_m7.conf) at the commit pinned in
# README.md.

CONFIG_IPM=y
CONFIG_OPENAMP=y
CONFIG_OPENAMP_MASTER=n
CONFIG_OPENAMP_RSC_TABLE=y
CONFIG_OPENAMP_RSC_TABLE_NUM_RPMSG_BUFF=8
CONFIG_OPENAMP_WITH_DCACHE=y
CONFIG_OPENAMP_COPY_RSC_TABLE=y

CONFIG_HWLM_RPMSG=y
