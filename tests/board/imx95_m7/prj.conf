#
# Board-independent settings. The rpmsg (OpenAMP) settings for the i.MX95
# M7 are in boards/imx95_evk_mimx9596_m7.conf.

CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=1024

# Do not let Zephyr drive any power domain. The DISPLAY domain belongs to
# Linux; the probe only queries its state.
CONFIG_POWER_DOMAIN=n

# Read-only DPU probe. Off by default; see Kconfig and README.md.
CONFIG_HWLM_DPU_PROBE=n
