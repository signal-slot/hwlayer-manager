# Console: printk over the board's console UART. CONFIG_DISPLAY and the DPU
# driver are only built with CONFIG_IMX95_M7_SCENE_ENABLE_DPU=y (see Kconfig).
CONFIG_PRINTK=y

# Trace lines print 64-bit values (seq, t, at, sub).
CONFIG_CBPRINTF_FULL_INTEGRAL=y

# libcomposition_engine.a is built for thumbv7em-none-eabihf, which passes
# floating-point arguments in FPU registers. Without the hard-float ABI the
# link fails on mismatched VFP attributes.
CONFIG_FPU=y
CONFIG_FP_HARDABI=y

# The planner runs on the caller's stack. 16 KiB leaves room for its search
# state; not measured on the target (same margin as imx95_m7_engine).
CONFIG_MAIN_STACK_SIZE=16384
