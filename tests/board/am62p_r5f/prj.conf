# SPDX-License-Identifier: Apache-2.0
#
# Board test of the composition engine on the Verdin AM62P's MCU R5F.
# Not yet configured against the demo module (docs/board-test-am62p-r5f.md):
# compare with the demo firmware's configuration fragments before the first
# build.

CONFIG_PRINTK=y
CONFIG_DISPLAY=y

# The engine is built for armv7r-none-eabihf: the image must use the
# hard-float ABI too.
CONFIG_FPU=y
CONFIG_FP_HARDABI=y

# ce_present and ce_poll_event run on the main thread.
CONFIG_MAIN_STACK_SIZE=8192

# Started by Linux through remoteproc, with the console in a RAM buffer that
# the resource table offers to Linux as a trace buffer.
CONFIG_OPENAMP=y
CONFIG_OPENAMP_RSC_TABLE=y
CONFIG_RAM_CONSOLE=y
