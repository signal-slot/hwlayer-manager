# SPDX-License-Identifier: Apache-2.0
#
# Board test of the composition engine on the Verdin AM62P's MCU R5F,
# started from the board's Linux through remoteproc while Linux keeps
# running (docs/board-test-am62p-r5f.md). The board's defconfig and the demo
# module's drivers (the DSS, the DSI host, the bridge and panel) come with
# the board; this file only moves the console and switches off what Linux
# keeps.

# The console is a RAM buffer that the SoC's resource table offers to Linux
# as the remote processor's trace buffer; Linux keeps the UART.
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_RAM_CONSOLE=y
CONFIG_PRINTK=y

CONFIG_WATCHDOG=n
CONFIG_I2C=y
CONFIG_GPIO=y

# The engine is built for armv7r-none-eabihf: the image uses the hard-float
# ABI too.
CONFIG_FPU=y
CONFIG_FP_HARDABI=y

# ce_present and ce_poll_event run on the main thread.
CONFIG_MAIN_STACK_SIZE=16384
