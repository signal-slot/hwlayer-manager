[workspace]
resolver = "2"
members = ["crates/composition-core", "crates/composition-fake", "crates/composition-drm", "crates/composition-ffi", "crates/composition-ffi-staticlib", "backends/twoplane", "tools/vm-init", "tools/drm-harness"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
publish = false
license = "Apache-2.0"
repository = "https://github.com/signal-slot/hwlayer-manager"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
