[package]
name = "composition-ffi-staticlib"
description = "The C ABI of the hardware composition engine as a static library for C programs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# libcomposition_engine.a, next to include/composition_engine.h of composition-ffi
name = "composition_engine"
crate-type = ["staticlib"]

[features]
default = ["std"]
# Link the Rust standard library (hosted builds). Without it the library is
# no_std and the final program must provide a panic handler, or enable
# `panic-handler`.
std = ["composition-ffi/std"]
# Provide a panic handler that halts. For bare-metal C programs that link
# this library and contain no other Rust code.
panic-handler = []

[dependencies]
composition-ffi = { path = "../composition-ffi", default-features = false }

[lints]
workspace = true
